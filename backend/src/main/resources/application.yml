server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: talentiq-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentiq}
    username: ${SPRING_DATASOURCE_USERNAME:talentiq}
    password: ${SPRING_DATASOURCE_PASSWORD:talentiq}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    origin: ${APP_CORS_ORIGIN:http://localhost:5173,http://localhost}
  storage:
    path: ${APP_STORAGE_PATH:./uploads}
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-key-please-override-in-prod-min-256-bits-long-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.talentiq: INFO
