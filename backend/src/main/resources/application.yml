server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: talentiq-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentiq}
    username: ${SPRING_DATASOURCE_USERNAME:talentiq}
    password: ${SPRING_DATASOURCE_PASSWORD:talentiq}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    origin: ${APP_CORS_ORIGIN:http://localhost:5173,http://localhost}
  storage:
    path: ${APP_STORAGE_PATH:./uploads}
  supabase:
    jwks-uri: ${SUPABASE_JWKS_URI:${SUPABASE_URL:}/auth/v1/.well-known/jwks.json}
    issuer: ${SUPABASE_ISSUER:${SUPABASE_URL:}/auth/v1}
  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.talentiq: INFO
