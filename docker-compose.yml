version: "3.9"

# Local dev stack — backend and frontend containers only. The database and auth are Supabase
# (hosted), not run locally. Point SPRING_DATASOURCE_* and SUPABASE_* at your Supabase project
# via .env (see .env.example).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentiq-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL}
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN:-http://localhost:5173,http://localhost}
      SERVER_PORT: ${SERVER_PORT:-8080}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8080:8080"
    volumes:
      - resume-uploads:/app/uploads
    networks:
      - talentiq-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: talentiq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - talentiq-net

networks:
  talentiq-net:
    driver: bridge

volumes:
  resume-uploads:
